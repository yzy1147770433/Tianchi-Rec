name: Syntax check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python sources
        run: >-
          python -m py_compile
          src/__init__.py src/tianchi_rec/__init__.py src/tianchi_rec/config.py
          Baseline.py Recall.py tezhenggongcheng.py
          rank.py rank_final.py run_pipeline.py
